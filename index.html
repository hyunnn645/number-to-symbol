<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 기호 변환기</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-main: #333333;
            --accent-color: #5a67d8;
            --accent-hover: #434190;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--container-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 { 
            margin-top: 0; 
            margin-bottom: 25px; 
            color: var(--text-main); 
            font-size: 22px;
            font-weight: 600;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 15px; 
            font-size: 16px; 
            box-sizing: border-box; 
            text-align: center; 
            border: 1px solid #e2e8f0; 
            border-radius: 10px; 
            background-color: #f8fafc;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .convert-btn { 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            cursor: pointer; 
            background-color: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: 600; 
            transition: background-color 0.2s;
        }
        .convert-btn:hover {
            background-color: var(--accent-hover);
        }
        .result-container { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            margin-top: 30px; 
            min-height: 80px;
        }
        #result { 
            font-size: 36px; 
            letter-spacing: 4px; 
            color: var(--text-main);
            font-weight: 500;
        }
        .copy-btn { 
            padding: 8px 20px; 
            font-size: 14px; 
            cursor: pointer; 
            background-color: #edf2f7; 
            color: #4a5568; 
            border: none; 
            border-radius: 8px; 
            font-weight: 500; 
            transition: all 0.2s;
            display: none; 
        }
        .copy-btn:hover {
            background-color: #e2e8f0;
            color: #1a202c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>숫자 기호 변환기</h2>
        <input type="text" id="inputBox" placeholder="입력 (예: 080908, 121315)" maxlength="6">
        <button class="convert-btn" onclick="convert()">변환</button>
        
        <div class="result-container">
            <div id="result"></div>
            <button class="copy-btn" id="copyBtn" onclick="copyText()">복사하기</button>
        </div>
    </div>

    <script>
        const symbols = ['⓪','①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
        
        function convert() {
            const val = document.getElementById('inputBox').value.replace(/[^0-9]/g, '');
            let res = '';
            for (let i = 0; i < val.length; i += 2) {
                const num = parseInt(val.substring(i, i + 2), 10);
                if (num >= 0 && num <= 20) {
                    res += symbols[num];
                }
            }
            
            document.getElementById('result').innerText = res;
            
            if(res.length > 0) {
                document.getElementById('copyBtn').style.display = 'block';
            } else {
                document.getElementById('copyBtn').style.display = 'none';
            }
        }

        function copyText() {
            const resultText = document.getElementById('result').innerText;
            navigator.clipboard.writeText(resultText).then(() => {
                alert('복사되었습니다.');
            }).catch(err => {
                console.error('복사 실패:', err);
            });
        }
    </script>
</body>
</html>
